<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnionCoin - Crypto Dashboard</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Crypto Theme -->
    <link rel="stylesheet" href="/static/css/crypto-theme.css">

    <style>
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .add-account-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 2px dashed rgba(79, 172, 254, 0.3);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .add-account-card:hover {
            border-color: rgba(79, 172, 254, 0.6);
            background: rgba(79, 172, 254, 0.1);
            transform: scale(1.02);
        }

        .add-account-card i {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: #4facfe;
        }

        .add-account-card h3 {
            color: var(--text-primary);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .add-account-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-glow);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-glow);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .action-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-primary);
        }

        .action-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-glow);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .action-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--accent-glow);
        }

        .action-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .action-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-glow);
            border-radius: 50%;
            animation: float 15s infinite linear;
            opacity: 0.6;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Animated Background -->
    <div class="floating-particles" id="particles"></div>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="header-section">
            <div class="logo">🚀 UnionCoin</div>
            <div class="tagline">Next-Generation Crypto Ecosystem</div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-coins"></i>
                </div>
                <div class="stat-value" id="totalSupply">0</div>
                <div class="stat-label">Total Supply</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-exchange-alt"></i>
                </div>
                <div class="stat-value" id="totalTransactions">0</div>
                <div class="stat-label">Transactions</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="stat-value">100%</div>
                <div class="stat-label">Security</div>
            </div>
        </div>

        <!-- User Accounts Grid -->
        <div class="accounts-grid" id="accountsGrid">
            <!-- Accounts will be loaded here -->
        </div>

        <!-- Add Account Button -->
        <div class="add-account-card" onclick="addNewAccount()">
            <i class="fas fa-plus-circle"></i>
            <h3>Add New Account</h3>
            <p>Create up to 3 accounts per device</p>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <a href="/register" class="action-card">
                <div class="action-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div class="action-title">Create Wallet</div>
                <div class="action-desc">New user registration</div>
            </a>

            <a href="/login" class="action-card">
                <div class="action-icon">
                    <i class="fas fa-sign-in-alt"></i>
                </div>
                <div class="action-title">Login</div>
                <div class="action-desc">Access existing wallet</div>
            </a>

            <a href="/api/data?admin=unioncoin_admin_2026" class="action-card">
                <div class="action-icon">
                    <i class="fas fa-chart-bar"></i>
                </div>
                <div class="action-title">Analytics</div>
                <div class="action-desc">View data & statistics</div>
            </a>

            <a href="#" class="action-card" onclick="openTelegramBot()">
                <div class="action-icon">
                    <i class="fab fa-telegram"></i>
                </div>
                <div class="action-title">Telegram Bot</div>
                <div class="action-desc">Control via Telegram</div>
            </a>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Load user accounts
        async function loadAccounts() {
            try {
                const response = await fetch('/api/user-accounts');
                const accounts = await response.json();

                const accountsGrid = document.getElementById('accountsGrid');
                accountsGrid.innerHTML = '';

                accounts.forEach(account => {
                    const accountCard = document.createElement('div');
                    accountCard.className = 'profile-card';
                    accountCard.innerHTML = `
                        <div class="profile-avatar" style="background: ${account.profile_color}">
                            ${account.username.charAt(0).toUpperCase()}
                        </div>
                        <div class="profile-name">${account.username}</div>
                        <div class="profile-balance">${account.balance.toFixed(2)} UC</div>
                        <div class="profile-wallet">${account.wallet_address}</div>
                        ${account.is_primary ? '<div style="color: var(--accent-glow); margin-top: 10px;">⭐ Primary Account</div>' : ''}
                    `;
                    accountsGrid.appendChild(accountCard);
                });
            } catch (error) {
                console.log('Error loading accounts:', error);
            }
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();

                document.getElementById('totalUsers').textContent = stats.totalUsers || 0;
                document.getElementById('totalSupply').textContent = (stats.totalSupply || 0).toFixed(0);
                document.getElementById('totalTransactions').textContent = stats.totalTransactions || 0;
            } catch (error) {
                console.log('Error loading stats:', error);
            }
        }

        // Add new account
        function addNewAccount() {
            window.location.href = '/register';
        }

        // Open Telegram bot
        function openTelegramBot() {
            window.open('https://t.me/tokenuchunku12bot', '_blank');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function () {
            createParticles();
            loadAccounts();
            loadStats();

            // Refresh data every 30 seconds
            setInterval(() => {
                loadStats();
            }, 30000);
        });
    </script>
</body>

</html>
