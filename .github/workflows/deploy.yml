name: UnionCoin CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax
        run: |
          python -m py_compile bot.py database.py api.py run.py

      - name: Database Initialization Test
        env:
          DATABASE_URL: sqlite:///test.db
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || 'fake_token' }}
          ADMIN_ID: ${{ secrets.ADMIN_ID || '12345' }}
        run: |
          python database.py
          echo "✅ Database initialized successfully"

  deploy_trigger:
    name: Deployment Note
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Success Message
        run: |
          echo "🚀 Code verified! Render will now automatically deploy if connected."
