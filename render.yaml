services:
  # Web Service
  - type: web
    name: unioncoin-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python api.py"
    envVars:
      - key: DATABASE_URL
        value: "postgresql://unioncoin_user:unioncoin_password@unioncoin-db:5432/unioncoin"
      - key: BOT_TOKEN
        value: "8362335664:AAHzVL2gFmgu8X3QoxYTiLtZNFTbZom9_7A"
      - key: ADMIN_ID
        value: "1685342390"
      - key: SECRET_KEY
        value: "unioncoin_production_secret_key_2026"
      - key: ADMIN_PASSWORD
        value: "unioncoin_admin_2026"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "False"
    healthCheckPath: "/verify"
    autoDeploy: true

  # PostgreSQL Database
  - type: pserv
    name: unioncoin-db
    env: postgres
    plan: free
    databaseName: unioncoin
    user: unioncoin_user
    password: unioncoin_password
    healthCheckPath: "/"

  # Background Bot Service
  - type: worker
    name: unioncoin-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: DATABASE_URL
        value: "postgresql://unioncoin_user:unioncoin_password@unioncoin-db:5432/unioncoin"
      - key: BOT_TOKEN
        value: "8362335664:AAHzVL2gFmgu8X3QoxYTiLtZNFTbZom9_7A"
      - key: ADMIN_ID
        value: "1685342390"
      - key: SECRET_KEY
        value: "unioncoin_production_secret_key_2026"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "False"

# Build and deployment settings
build:
  - type: build
    name: unioncoin-build
    env: python
    buildCommand: "pip install -r requirements.txt && python database.py"
    buildFilter:
      paths:
        - "api.py"
        - "bot.py"
        - "database.py"
        - "requirements.txt"
        - "templates/"
        - "static/"

# Environment variables for all services
globalEnvVars:
  - key: PYTHON_VERSION
    value: "3.11"
  - key: DATABASE_URL
    value: "postgresql://unioncoin_user:unioncoin_password@unioncoin-db:5432/unioncoin"
  - key: BOT_TOKEN
    value: "8362335664:AAHzVL2gFmgu8X3QoxYTiLtZNFTbZom9_7A"
  - key: ADMIN_ID
    value: "1685342390"
  - key: SECRET_KEY
    value: "unioncoin_production_secret_key_2026"
  - key: ADMIN_PASSWORD
    value: "unioncoin_admin_2026"
  - key: HOST
    value: "0.0.0.0"
  - key: PORT
    value: "8000"
  - key: DEBUG
    value: "False"

# Health checks
healthChecks:
  - type: web
    name: unioncoin-web-health
    path: "/verify"
    interval: 30
    timeout: 10
    gracePeriod: 60
    
  - type: worker
    name: unioncoin-bot-health
    path: "/verify"
    interval: 60
    timeout: 10
    gracePeriod: 120

# Auto-scaling (paid plans)
scaling:
  - type: web
    name: unioncoin-web
    minInstances: 1
    maxInstances: 10
    targetCPU: 70
    targetMemory: 80
    
  - type: worker
    name: unioncoin-bot
    minInstances: 1
    maxInstances: 3
    targetCPU: 60
    targetMemory: 70

# Custom domains (optional)
domains:
  - domain: unioncoin.onrender.com
    type: primary
  - domain: yourdomain.com
    type: custom
